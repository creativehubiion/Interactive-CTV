<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1920, initial-scale=1, user-scalable=no" />
  <title>Interactive CTV Ad — Fruit Catch</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- Early-bird message buffer (see KNOWLEDGE-BASE.md §2 for why). -->
  <script>
    (function () {
      window.__simidEarlyBuffer = [];
      window.__simidEarlyHandler = function (event) {
        window.__simidEarlyBuffer.push({ data: event.data, source: event.source, origin: event.origin });
      };
      window.addEventListener('message', window.__simidEarlyHandler, true);
    })();
  </script>
</head>
<body>
  <div id="stage" class="stage" aria-hidden="true">

    <!-- Solid background panel. Full-screen, opaque — covers the linear video
         underneath so the ad area is fully owned by the game. -->
    <div class="bg"></div>

    <!-- HUD strip: brand, score, timer, skip. -->
    <header class="game-head">
      <div class="brand">YOUR BRAND</div>
      <div class="score-box"><span class="label">SCORE</span><span id="score">0</span></div>
      <div class="timer-box"><span class="label">TIME</span><span id="timer">0:30</span></div>
      <button id="skip" class="skip-btn" tabindex="0" aria-label="Skip ad">SKIP ▶</button>
    </header>

    <!-- Game field — falling items + player live here. -->
    <div id="field" class="field">
      <!--
        Basket — inline SVG so we don't depend on the device emoji font.
        Fire OS 7's bundled emoji font is missing 🧺 (Emoji 11.0, 2018);
        fruits (Emoji 1.0–3.0) render fine, basket showed as tofu.
      -->
      <svg id="player" class="player" viewBox="0 0 120 100" aria-label="Basket">
        <!-- Handle -->
        <path d="M 30 35 Q 60 0 90 35"
              fill="none" stroke="#6b3a16" stroke-width="6" stroke-linecap="round"/>
        <!-- Basket body (woven look via repeated lines) -->
        <path d="M 12 35 L 108 35 L 96 92 Q 60 100 24 92 Z"
              fill="#a0521e" stroke="#5a2e0d" stroke-width="3"/>
        <!-- Rim -->
        <ellipse cx="60" cy="35" rx="48" ry="8" fill="#d28653" stroke="#5a2e0d" stroke-width="3"/>
        <!-- Weave lines -->
        <path d="M 18 50 Q 60 56 102 50" fill="none" stroke="#5a2e0d" stroke-width="2" opacity="0.85"/>
        <path d="M 21 65 Q 60 72  99 65" fill="none" stroke="#5a2e0d" stroke-width="2" opacity="0.85"/>
        <path d="M 25 80 Q 60 87  95 80" fill="none" stroke="#5a2e0d" stroke-width="2" opacity="0.85"/>
      </svg>
    </div>

    <!-- Instruction strip at the bottom. Fades after first input. -->
    <footer id="hint" class="hint-strip">
      <span><span class="key">◀ ▶</span> Move basket</span>
      <span><span class="key">OK</span> Start</span>
      <span><span class="key">BACK</span> Skip</span>
    </footer>

    <!-- End-of-round overlay. Hidden until time runs out. -->
    <div id="endcard" class="endcard hidden">
      <h1 id="end-title">Time's up!</h1>
      <p>You scored <span id="end-score">0</span> points</p>
      <p class="end-cta">Returning you to your show…</p>
    </div>
  </div>

  <!-- Debug HUD. Default ON. ?debug=0 to suppress. -->
  <div id="hud" class="hud">
    <div class="hud-head">
      <span class="hud-title">SIMID DEBUG</span>
      <span class="hud-meta" id="hud-meta">booting…</span>
    </div>
    <div class="hud-body" id="hud-body"></div>
  </div>

  <script src="hud.js"></script>
  <script src="simid-protocol.js"></script>
  <script src="game.js"></script>
  <script src="app.js"></script>
</body>
</html>
