<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1920, initial-scale=1, user-scalable=no" />
  <title>Interactive CTV Ad — Allkinds</title>
  <link rel="stylesheet" href="styles.css" />

  <!--
    Early-bird message buffer. The iframe may receive SIMID:Player:init
    from IMA before our external scripts finish loading on slow CTV
    WebViews. If we miss init, IMA never resolves and the iframe stays
    hidden. This inline script captures every postMessage into a buffer
    that simid-protocol.js drains as soon as it loads.
  -->
  <script>
    (function () {
      window.__simidEarlyBuffer = [];
      window.__simidEarlyHandler = function (event) {
        window.__simidEarlyBuffer.push({ data: event.data, source: event.source, origin: event.origin });
      };
      window.addEventListener('message', window.__simidEarlyHandler, true);
    })();
  </script>
</head>
<body>
  <!--
    Game stage. The Phaser game is embedded in an iframe; our SIMID layer
    handles the postMessage handshake with IMA. The iframe gets keyboard
    focus once SIMID:Player:startCreative arrives, so D-pad presses on
    the TV remote reach the game's own keydown listener directly.

    The "skip" button is visible only briefly to keep the experience
    clean, but always reachable via the Back button on the remote.
  -->
  <div id="stage" class="stage" aria-hidden="true">
    <iframe id="game"
            class="game-frame"
            title="Allkinds — interactive ad"
            allow="autoplay; gamepad; fullscreen"
            sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
            src="https://tech-iion.github.io/advertiser-creatives/allkindsLandscape/"></iframe>

    <button id="skip" class="skip-btn" tabindex="0" aria-label="Skip ad">Skip ▶</button>
  </div>

  <!-- Debug HUD. Visible by default; pass ?debug=0 to suppress. -->
  <div id="hud" class="hud">
    <div class="hud-head">
      <span class="hud-title">SIMID DEBUG</span>
      <span class="hud-meta" id="hud-meta">booting…</span>
    </div>
    <div class="hud-body" id="hud-body"></div>
  </div>

  <script src="hud.js"></script>
  <script src="simid-protocol.js"></script>
  <script src="app.js"></script>
</body>
</html>
